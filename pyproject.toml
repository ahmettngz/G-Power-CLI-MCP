[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpower-clone"
version = "1.0.0"
description = "Clean-room statistical power analysis engine, CLI, REST API, MCP Server, and Clinical AI Agent for Paired Samples t-Test (t-paired)"
requires-python = ">=3.10"
authors = [
  { name = "Takım 2 - Clean Room Sprint" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "scipy>=1.10"
]

[project.scripts]
gpower-clone = "src.cli:main"
gpower-mcp = "src.mcp_server:main"
gpower-api = "src.api_server:main"
gpower-agent = "src.agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
